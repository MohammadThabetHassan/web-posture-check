[build-system]
# 77+ understands the SPDX license expression below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-posture-check"
dynamic = ["version"]
description = "Check a website's security posture from the command line: headers, cookies, CORS, TLS, CAA, security.txt, SPF, DMARC and DKIM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad Thabet" }, { name = "Omar Alraas" }]
requires-python = ">=3.9"
keywords = ["security", "security-headers", "tls", "cors", "spf", "dmarc", "dkim", "csp", "hsts", "devsecops", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MohammadThabetHassan/web-posture-check"
Documentation = "https://github.com/MohammadThabetHassan/web-posture-check#readme"
Issues = "https://github.com/MohammadThabetHassan/web-posture-check/issues"
Changelog = "https://github.com/MohammadThabetHassan/web-posture-check/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# DNS-based checks (CAA, SPF, DMARC, DKIM). The core tool stays dependency-free.
dns = ["dnspython>=2.0"]
# Development tools, pinned so CI and local runs check the same way.
# mypy 2 and coverage 7.11+ need Python 3.10+; Python 3.9 gets the last coverage that supports it
# and no mypy (CI type-checks on 3.13).
dev = [
    "ruff==0.17.0",
    "mypy==2.3.1; python_version >= '3.10'",
    "coverage==7.16.2; python_version >= '3.10'",
    "coverage[toml]==7.10.7; python_version < '3.10'",  # 3.9 has no tomllib
]

[project.scripts]
web-posture-check = "webposture.cli:main"

[tool.setuptools.dynamic]
version = { attr = "webposture.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# PEP 561: the package ships its type annotations.
webposture = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors and warnings, import order, bugbear, pyupgrade,
# simplify, misc and Ruff's own rules. Listed explicitly so new Ruff releases
# do not change what CI enforces.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PIE", "RUF"]
# Finding messages are kept on one line so they stay easy to grep for.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests keep fixed lookup tables as plain class attributes.
"tests/*" = ["RUF012"]

[tool.mypy]
# The oldest version mypy still checks; the code itself supports 3.9 (CI tests it there).
python_version = "3.10"
files = ["src", "tests"]
# Everything, tests included, is checked inside every function.
check_untyped_defs = true
strict_equality = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# The package itself is fully annotated and gets the rest of what --strict
# checks; tests need not annotate every test method.
module = ["webposture", "webposture.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true

[tool.coverage.run]
branch = true
source = ["webposture"]

[tool.coverage.report]
# Branch coverage; CI fails below this. The suite covers 100%; the margin is for
# lines that only run on some Python versions.
fail_under = 99
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
