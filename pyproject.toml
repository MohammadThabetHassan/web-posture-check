[build-system]
# 77+ understands the SPDX license expression below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-posture-check"
dynamic = ["version"]
description = "Check a website's security posture from the command line: headers, cookies, CORS, TLS, CAA, security.txt, SPF, DMARC and DKIM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad Thabet" }, { name = "Omar Alraas" }]
requires-python = ">=3.9"
keywords = ["security", "security-headers", "tls", "cors", "spf", "dmarc", "dkim", "csp", "hsts", "devsecops", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MohammadThabetHassan/web-posture-check"
Documentation = "https://github.com/MohammadThabetHassan/web-posture-check#readme"
Issues = "https://github.com/MohammadThabetHassan/web-posture-check/issues"
Changelog = "https://github.com/MohammadThabetHassan/web-posture-check/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# DNS-based checks (CAA, SPF, DMARC, DKIM). The core tool stays dependency-free.
dns = ["dnspython>=2.0"]
# Development tools, pinned so CI and local runs lint the same way.
dev = ["ruff==0.17.0"]

[project.scripts]
web-posture-check = "webposture.cli:main"

[tool.setuptools.dynamic]
version = { attr = "webposture.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors and warnings, import order, bugbear, pyupgrade,
# simplify, misc and Ruff's own rules. Listed explicitly so new Ruff releases
# do not change what CI enforces.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PIE", "RUF"]
# Finding messages are kept on one line so they stay easy to grep for.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests keep fixed lookup tables as plain class attributes.
"tests/*" = ["RUF012"]
