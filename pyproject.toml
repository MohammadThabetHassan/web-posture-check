[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "web-posture-check"
version = "0.1.0"
description = "Check a website's security posture from the command line"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammad Thabet" }]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
web-posture-check = "webposture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
