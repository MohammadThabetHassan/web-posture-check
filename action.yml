name: web-posture-check
description: Grade a website's security posture (headers, cookies, CORS, TLS, CAA, security.txt, SPF, DMARC, DKIM).
author: Mohammad Thabet and Omar Alraas
branding:
  icon: shield
  color: green

inputs:
  targets:
    description: Domains or URLs to check, separated by spaces or new lines.
    required: true
  args:
    description: >-
      Extra options, e.g. "--only tls-certificate,caa" or "--fail-on warn".
      Do not pass --format, --json, --output, --sarif or --sarif-location; the action writes
      the Markdown report and the SARIF log itself.
    required: false
    default: ""
  dns:
    description: Install the optional DNS support so the CAA, SPF, DMARC and DKIM checks run ("true" or "false").
    required: false
    default: "true"
  python-version:
    description: Python version to run the tool with.
    required: false
    default: "3.12"

outputs:
  score:
    description: Lowest score (0-100) across the targets, empty if nothing could be scored.
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: Worst letter grade (A to F) across the targets, empty if nothing could be scored.
    value: ${{ steps.scan.outputs.grade }}
  exit-code:
    description: The tool's exit code (0 no FAIL, 1 a FAIL or with --fail-on warn a WARN, 2 a target could not be reached).
    value: ${{ steps.scan.outputs.exit-code }}
  report:
    description: Path of the Markdown report file.
    value: ${{ steps.scan.outputs.report }}
  sarif:
    description: >-
      Path of the SARIF 2.1.0 log, for github/codeql-action/upload-sarif. Results point to the
      workflow file that ran the scan, and each one names the scanned URL.
    value: ${{ steps.scan.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install web-posture-check
      shell: bash
      # Inputs reach the shell through environment variables, never by direct
      # interpolation into the script, so they cannot inject commands.
      env:
        ACTION_PATH: ${{ github.action_path }}
        WITH_DNS: ${{ inputs.dns }}
      run: |
        if [ "$WITH_DNS" = "true" ]; then
          python -m pip install --quiet "${ACTION_PATH}[dns]"
        else
          python -m pip install --quiet "${ACTION_PATH}"
        fi

    - name: Run web-posture-check
      id: scan
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        # Split targets and options on whitespace on purpose, with globbing
        # off so a value such as "*" is passed through literally.
        set -f
        set +e
        report="$RUNNER_TEMP/web-posture-report.md"
        sarif="$RUNNER_TEMP/web-posture-check.sarif"
        # Code scanning needs a file in this repository for each result: use the
        # workflow file that runs the scan ("owner/repo/path@ref" -> "path").
        anchor="${GITHUB_WORKFLOW_REF%%@*}"
        anchor="${anchor#"$GITHUB_REPOSITORY"/}"
        case "$anchor" in
          .github/workflows/*) anchor_args=(--sarif-location "$anchor") ;;
          *) anchor_args=() ;;
        esac
        web-posture-check $TARGETS $EXTRA_ARGS --format markdown --output "$report" --sarif "$sarif" "${anchor_args[@]}"
        code=$?
        set -e
        touch "$report"
        cat "$report"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        # Lowest score and worst grade across every "**Grade X** (N/100)" line of the report.
        python - "$report" >> "$GITHUB_OUTPUT" <<'PY'
        import re, sys
        found = re.findall(r"\*\*Grade ([A-F])\*\* \((\d+)/100\)", open(sys.argv[1], encoding="utf-8").read())
        print("score=" + (str(min(int(s) for _, s in found)) if found else ""))
        print("grade=" + (max(g for g, _ in found) if found else ""))
        PY
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        if [ -s "$sarif" ]; then echo "sarif=$sarif" >> "$GITHUB_OUTPUT"; fi
        exit $code
