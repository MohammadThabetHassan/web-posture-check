name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ".[dns,dev]"
      # --output-format=github surfaces findings as inline annotations on the PR.
      - run: ruff check --output-format=github src tests
      # Type checks every function body, tests included (settings in pyproject.toml).
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Editable, so the coverage report names files under src/.
      - run: pip install -e ".[dns,dev]"
      # Branch coverage; the report fails below fail_under in pyproject.toml.
      - run: coverage run -m unittest discover -s tests -v
      - name: Coverage
        run: |
          coverage report --format=markdown --no-skip-covered > coverage.md || true
          { echo "### Branch coverage (Python ${{ matrix.python-version }})"; echo; cat coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          coverage report
