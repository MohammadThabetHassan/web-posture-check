name: Bug report
description: A check gives a wrong result, or the tool or Action fails
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a vulnerability in the tool itself, please follow SECURITY.md instead of opening an issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `web-posture-check --version`, or the Action ref you use
      placeholder: web-posture-check 0.3.0
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or workflow step
      placeholder: web-posture-check example.com --only csp
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the output. Remove anything you do not want to share.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a wrong PASS, WARN or FAIL, say why, ideally with the RFC or spec section.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: Python 3.12 on Ubuntu 24.04
